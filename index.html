<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기사 노트</title>
<style>
  :root {
    --bg: #fbfbfa;
    --paper: #ffffff;
    --ink: #2b2a27;
    --sub: #8a877f;
    --line: #e9e7e2;
    --accent: #7a5c3a;
    --accent-soft: #f4efe8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  .page { max-width: 680px; margin: 0 auto; padding: 56px 24px 96px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
  h1 {
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    font-size: 30px; line-height: 1.3; font-weight: 700;
    margin: 0 0 36px; letter-spacing: -0.01em;
  }
  section { margin-bottom: 44px; }
  .h2row {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line); margin: 0 0 12px; padding-bottom: 8px;
  }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--sub); margin: 0; }
  .count { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--line); border-radius: 3px; margin: -4px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

  .field {
    width: 100%; border: none; outline: none; background: transparent;
    font: inherit; color: var(--ink); padding: 6px 0; resize: none;
  }
  .field::placeholder { color: #c4c1b9; }
  .field:focus { background: var(--accent-soft); border-radius: 4px; }
  .project-line { font-size: 19px; line-height: 1.6; }
  .tag {
    display: inline-block; padding: 3px 12px; background: var(--accent-soft);
    color: var(--accent); border-radius: 999px; font-size: 15px; font-weight: 600;
  }

  .todo { display: flex; align-items: center; gap: 12px; padding: 2px 0; border-bottom: 1px solid var(--line); }
  .todo:last-child { border-bottom: none; }
  .todo input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none;
    width: 20px; height: 20px; border: 1.5px solid #cfccc4; border-radius: 5px;
    background: var(--paper); cursor: pointer; position: relative; margin: 0;
  }
  .todo input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  .todo input[type=checkbox]:checked::after {
    content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .todo .field { padding: 10px 0; }
  .todo input[type=checkbox]:checked + .field { color: var(--sub); text-decoration: line-through; }

  .x {
    flex: none; background: none; border: none; color: #c9c6be; font-size: 18px;
    line-height: 1; padding: 8px; cursor: pointer; border-radius: 6px;
  }
  .x:hover { color: #a33; background: var(--accent-soft); }

  .entry {
    display: grid; grid-template-columns: 78px 1fr auto; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }
  .date { font-size: 14px; font-weight: 600; color: var(--accent); padding-top: 7px; font-variant-numeric: tabular-nums; }
  .date small { display: block; color: var(--sub); font-weight: 400; font-size: 12px; margin-top: -4px; }
  .today-mark {
    display: inline-block; font-size: 10px; background: var(--accent); color: #fff;
    border-radius: 3px; padding: 0 5px; margin-left: 4px; vertical-align: 1px;
  }

  .addrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button.add, .btn {
    background: none; border: 1px dashed #d6d3cb; color: var(--sub);
    border-radius: 8px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  button.add { width: 100%; margin-top: 10px; }
  .addrow button.add { width: auto; margin-top: 0; flex: 1; }
  button.add:hover, .btn:hover { background: var(--accent-soft); color: var(--accent); }
  input[type=date] {
    font: inherit; font-size: 14px; color: var(--sub); border: 1px dashed #d6d3cb;
    border-radius: 8px; padding: 8px 10px; background: none;
  }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn { border-style: solid; border-color: var(--line); background: var(--paper); }
  .hint { font-size: 12px; color: #b3b0a8; margin-top: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 13px; padding: 8px 16px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.on { opacity: .92; }

  @media (max-width: 480px) {
    .page { padding: 36px 18px 72px; }
    h1 { font-size: 26px; margin-bottom: 28px; }
    .entry { grid-template-columns: 62px 1fr auto; gap: 8px; }
  }
  @media print {
    body { background: #fff; }
    .page { padding: 0; }
    .x, .addrow, button.add, .tools, .hint, .toast { display: none !important; }
    .field:focus { background: none; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="eyebrow">PROJECT NOTE</div>
  <h1>기사 프로젝트 노트</h1>

  <section>
    <div class="h2row"><h2>프로젝트 한 줄</h2></div>
    <textarea class="field project-line" id="brief" rows="1" placeholder="프로젝트를 한 줄로 적어 주세요"></textarea>
  </section>

  <section>
    <div class="h2row"><h2>주제</h2></div>
    <span class="tag">AI와 교육</span>
  </section>

  <section>
    <div class="h2row"><h2>할 일 체크리스트</h2><span class="count" id="count"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div id="todos"></div>
    <button class="add" id="addTodo" type="button">+ 할 일 추가</button>
  </section>

  <section>
    <div class="h2row"><h2>날짜별 기록</h2></div>
    <div id="log"></div>
    <div class="addrow">
      <button class="add" id="addToday" type="button">+ 오늘 기록 추가</button>
      <input type="date" id="pickDate" aria-label="날짜 선택" min="2026-11-18">
      <button class="add" id="addPicked" type="button">선택한 날짜 추가</button>
    </div>
  </section>

  <section>
    <div class="h2row"><h2>내보내기·백업</h2></div>
    <div class="tools">
      <button class="btn" id="copyText" type="button">텍스트로 복사</button>
      <button class="btn" id="print" type="button">인쇄·PDF 저장</button>
      <button class="btn" id="backup" type="button">백업 파일 저장</button>
      <button class="btn" id="restore" type="button">백업 불러오기</button>
      <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    </div>
    <div class="hint">입력 내용은 이 기기의 브라우저에 자동 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에는 백업 파일을 저장해 두세요.</div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(function () {
  var KEY = "article-project-note-v2";
  var OLD = "article-project-note-v1";
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  var START = "2026-11-18";
  var state = { brief: "", todos: [], log: [] };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

  // 불러오기 (v1 형식이 있으면 변환)
  try {
    var s2 = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s2) state = s2;
    else {
      var s1 = JSON.parse(localStorage.getItem(OLD) || "null");
      if (s1) {
        state.brief = s1.brief || "";
        state.todos = s1.todos || [];
        state.log = (s1.log || []).map(function (e) {
          return { date: "2026-" + pad(e.m) + "-" + pad(e.d), text: e.text || "" };
        });
      }
    }
  } catch (e) {}

  while (state.todos.length < 5) state.todos.push({ text: "", done: false });
  if (!state.log.length) state.log.push({ date: START, text: "" });

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
  var toastEl = document.getElementById("toast"), toastT;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove("on"); }, 1800);
  }

  // 프로젝트 한 줄
  var brief = document.getElementById("brief");
  brief.value = state.brief || "";
  brief.addEventListener("input", function () { state.brief = brief.value; grow(brief); save(); });
  brief.addEventListener("keydown", function (e) { if (e.key === "Enter") e.preventDefault(); });

  // 체크리스트
  var todosEl = document.getElementById("todos");
  function updateProgress() {
    var filled = state.todos.filter(function (t) { return (t.text || "").trim(); });
    var done = filled.filter(function (t) { return t.done; }).length;
    document.getElementById("count").textContent = filled.length ? done + " / " + filled.length + " 완료" : "";
    document.getElementById("barFill").style.width = filled.length ? (done / filled.length * 100) + "%" : "0";
  }
  function renderTodos() {
    todosEl.innerHTML = "";
    state.todos.forEach(function (t, i) {
      var row = document.createElement("div");
      row.className = "todo";
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!t.done;
      var tx = document.createElement("input");
      tx.type = "text"; tx.className = "field";
      tx.placeholder = "할 일 " + (i + 1); tx.value = t.text || "";
      var del = document.createElement("button");
      del.className = "x"; del.type = "button"; del.textContent = "×"; del.title = "삭제";
      cb.addEventListener("change", function () { state.todos[i].done = cb.checked; save(); updateProgress(); });
      tx.addEventListener("input", function () { state.todos[i].text = tx.value; save(); updateProgress(); });
      tx.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          if (i === state.todos.length - 1) { state.todos.push({ text: "", done: false }); save(); renderTodos(); }
          var inputs = todosEl.querySelectorAll("input[type=text]");
          if (inputs[i + 1]) inputs[i + 1].focus();
        }
      });
      del.addEventListener("click", function () {
        state.todos.splice(i, 1);
        if (!state.todos.length) state.todos.push({ text: "", done: false });
        save(); renderTodos();
      });
      row.appendChild(cb); row.appendChild(tx); row.appendChild(del);
      todosEl.appendChild(row);
    });
    updateProgress();
  }
  document.getElementById("addTodo").addEventListener("click", function () {
    state.todos.push({ text: "", done: false }); save(); renderTodos();
    var inputs = todosEl.querySelectorAll("input[type=text]");
    inputs[inputs.length - 1].focus();
  });

  // 날짜별 기록
  var logEl = document.getElementById("log");
  function renderLog() {
    state.log.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    logEl.innerHTML = "";
    var today = iso(new Date());
    state.log.forEach(function (item) {
      var d = parse(item.date);
      var row = document.createElement("div");
      row.className = "entry";
      var date = document.createElement("div");
      date.className = "date";
      date.innerHTML = (d.getMonth() + 1) + "/" + d.getDate() +
        (item.date === today ? '<span class="today-mark">오늘</span>' : "") +
        "<small>" + DAYS[d.getDay()] + "요일</small>";
      var ta = document.createElement("textarea");
      ta.className = "field"; ta.rows = 1; ta.placeholder = "한 줄 기록"; ta.value = item.text || "";
      ta.addEventListener("input", function () { item.text = ta.value; grow(ta); save(); });
      var del = document.createElement("button");
      del.className = "x"; del.type = "button"; del.textContent = "×"; del.title = "이 날짜 삭제";
      del.addEventListener("click", function () {
        if ((item.text || "").trim() && !confirm("이 날짜의 기록을 삭제할까요?")) return;
        state.log.splice(state.log.indexOf(item), 1);
        save(); renderLog();
      });
      row.appendChild(date); row.appendChild(ta); row.appendChild(del);
      logEl.appendChild(row);
      grow(ta);
    });
  }
  function addDate(s) {
    if (s < START) { toast("11/18 이후 날짜만 추가할 수 있어요"); return; }
    if (state.log.some(function (e) { return e.date === s; })) { toast("이미 있는 날짜예요"); return; }
    state.log.push({ date: s, text: "" });
    save(); renderLog();
    var i = state.log.map(function (e) { return e.date; }).sort().indexOf(s);
    var tas = logEl.querySelectorAll("textarea");
    if (tas[i]) tas[i].focus();
  }
  document.getElementById("addToday").addEventListener("click", function () { addDate(iso(new Date())); });
  document.getElementById("addPicked").addEventListener("click", function () {
    var v = document.getElementById("pickDate").value;
    if (!v) { toast("날짜를 먼저 선택하세요"); return; }
    addDate(v);
  });

  // 텍스트로 복사
  function buildText() {
    var out = ["[기사 프로젝트 노트]", "", "프로젝트: " + (state.brief || ""), "주제: AI와 교육", "", "[할 일]"];
    state.todos.forEach(function (t) {
      if ((t.text || "").trim()) out.push((t.done ? "[x] " : "[ ] ") + t.text.trim());
    });
    out.push("", "[날짜별 기록]");
    state.log.forEach(function (e) {
      if ((e.text || "").trim()) {
        var d = parse(e.date);
        out.push((d.getMonth() + 1) + "/" + d.getDate() + " (" + DAYS[d.getDay()] + ") " + e.text.trim());
      }
    });
    return out.join("\n");
  }
  document.getElementById("copyText").addEventListener("click", function () {
    var text = buildText();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("복사했어요"); } catch (e) { toast("복사하지 못했어요"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("복사했어요"); }, fallback);
    } else fallback();
  });
  document.getElementById("print").addEventListener("click", function () { window.print(); });

  // 백업
  document.getElementById("backup").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "기사프로젝트노트-백업-" + iso(new Date()) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("백업 파일을 저장했어요");
  });
  var rf = document.getElementById("restoreFile");
  document.getElementById("restore").addEventListener("click", function () { rf.click(); });
  rf.addEventListener("change", function () {
    var f = rf.files && rf.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.todos) || !Array.isArray(d.log)) throw 0;
        if (!confirm("현재 내용을 백업 내용으로 바꿀까요?")) return;
        state = d; save(); location.reload();
      } catch (e) { toast("올바른 백업 파일이 아니에요"); }
    };
    r.readAsText(f);
    rf.value = "";
  });

  renderTodos();
  renderLog();
  grow(brief);
})();
</script>
</body>
</html>
